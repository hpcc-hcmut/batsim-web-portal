global:
  # 2s matches the progress parser's DB flush cadence (_DB_FLUSH_INTERVAL_S = 2.0)
  # so Prometheus sees each update. A 5k-job simulation (~28s wall-clock) yields
  # ~14 data points — enough for Grafana to render a smooth ramp instead of a cliff.
  # Storage cost: ~125 MB worst-case at 15d retention (trivial for lab use).
  scrape_interval: 2s
  evaluation_interval: 15s

scrape_configs:
  # Pick ONE based on deployment mode - having both active duplicates every
  # series in Prometheus and produces double-counted panels in Grafana.
  # Default: docker-compose mode. Swap targets if running backend on host.
  - job_name: "batsim-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
      # - targets: ["host.docker.internal:8000"]  # uncomment for host-side dev
