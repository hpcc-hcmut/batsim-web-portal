global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Pick ONE based on deployment mode - having both active duplicates every
  # series in Prometheus and produces double-counted panels in Grafana.
  # Default: docker-compose mode. Swap targets if running backend on host.
  - job_name: "batsim-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
      # - targets: ["host.docker.internal:8000"]  # uncomment for host-side dev
