global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # When backend runs in docker-compose
  - job_name: "batsim-backend-docker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  # When backend runs locally on host (local dev)
  - job_name: "batsim-backend-local"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
